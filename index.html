<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBGS Staffing Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1e2535;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  header .subtitle { font-size: 13px; color: #64748b; margin-top: 3px; }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .report-date  { font-size: 20px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .report-label { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; text-align: right; }

  .date-nav {
    display: flex; align-items: center; gap: 6px;
    background: #161b27; border: 1px solid #1e2535; border-radius: 8px; padding: 4px 8px;
  }
  .date-nav-btn {
    background: none; border: none; color: #64748b; cursor: pointer;
    font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: color 0.15s;
  }
  .date-nav-btn:hover:not(:disabled) { color: #f1f5f9; }
  .date-nav-btn:disabled { color: #1e2535; cursor: default; }
  #datePicker {
    background: transparent; border: none; color: #f1f5f9;
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; outline: none; padding: 0 2px;
    color-scheme: dark;
  }
  #datePicker::-webkit-calendar-picker-indicator {
    filter: invert(0.5); cursor: pointer;
  }

  .view-toggle {
    display: flex; background: #161b27; border: 1px solid #1e2535; border-radius: 8px; padding: 3px; gap: 2px;
  }
  .toggle-btn {
    padding: 5px 14px; border-radius: 6px; border: none; background: transparent;
    color: #64748b; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
  }
  .toggle-btn.active { background: #1e2535; color: #f1f5f9; }
  .toggle-btn:hover:not(.active) { color: #94a3b8; }

  .zone-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .zone-tab {
    padding: 5px 16px; border-radius: 20px; border: 1px solid #1e2535;
    background: transparent; color: #94a3b8; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .zone-tab:hover { border-color: #334155; color: #cbd5e1; }
  .zone-tab.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }

  /* Grid — 4 cols on wide screens */
  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  /* Card */
  .store-card {
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid #1e2535;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .store-name { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .store-zone { font-size: 11px; color: #475569; margin-top: 2px; }

  .status-badge {
    font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .status-mature  { background: #052e16; color: #34d399; border: 1px solid #065f46; }
  .status-ramping { background: #1e1a05; color: #fbbf24; border: 1px solid #713f12; }
  .status-new     { background: #0f172a; color: #94a3b8; border: 1px solid #1e2535; }

  /* Three metric panels */
  .card-body {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
  }

  .metric {
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-right: 1px solid #1e2535;
  }
  .metric:last-child { border-right: none; }

  .metric-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #64748b;
  }

  .metric-value {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    color: #f1f5f9;
  }

  .metric-sub {
    font-size: 11px;
    color: #475569;
    margin-top: 2px;
  }

  /* Status panel fills entire cell */
  .metric-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    gap: 4px;
  }

  .status-yes {
    background: rgba(45,212,191,0.12);
    border-left: 1px solid rgba(45,212,191,0.2);
  }
  .status-close {
    background: rgba(245,158,11,0.10);
    border-left: 1px solid rgba(245,158,11,0.2);
  }
  .status-no {
    background: rgba(251,113,133,0.12);
    border-left: 1px solid rgba(251,113,133,0.24);
  }
  .status-unknown {
    background: transparent;
    border-left: 1px solid #1e2535;
  }

  .status-word {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .status-yes   .status-word { color: #2dd4bf; }
  .status-close .status-word { color: #f59e0b; }
  .status-no    .status-word { color: #fb7185; }
  .status-unknown .status-word { color: #334155; }

  .status-sublabel {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #64748b;
    text-align: center;
  }
  .status-yes   .status-sublabel { color: rgba(45,212,191,0.6); }
  .status-close .status-sublabel { color: rgba(245,158,11,0.6); }
  .status-no    .status-sublabel { color: rgba(251,113,133,0.6); }

  .pending { font-size: 14px; font-weight: 600; color: #334155; }
</style>
</head>

  for (const day of DATA.history) {
    for (const [code, s] of Object.entries(day.stores)) {
      laborHours[code] = (laborHours[code] || 0) + (s.laborHours || 0);
    }
  }
  const stores = {};
  for (const code of Object.keys(DATA.mtdCSV)) {
    stores[code] = {
      games:          DATA.mtdDW[code]?.games ?? 0,
      revenue:        DATA.mtdCSV[code].revenue,
      laborHours:     laborHours[code] ?? null,
      laborCost:      DATA.mtdCSV[code].laborCost,
      mgmtIncluded:   true,  // total cost already includes mgmt — don't add again
    };
  }
  const dates = DATA.history.map(d => d.date);
  return { date: `${dates[0]} – ${dates[dates.length-1]}`, stores, days: dates.length };
}

function getSnowflakeData(key) {
  const src = DATA[key];
  const stores = {};
  for (const [code, s] of Object.entries(src.stores)) {
    stores[code] = { ...s };
  }
  return { date: src.label, stores, days: src.days };
}

// ─── CARD BUILDER ────────────────────────────────────────────────────────────
function buildCard(store) {
  const d = (window.__activeStores || {})[store.adp] || {};
  const games     = d.games ?? 0;
  const revenue   = d.revenue ?? 0;
  const laborHrs  = d.laborHours;
  const laborCost = d.laborCost;
  const periodDays = window.__activePeriodDays ?? 1;
  const mgmt = d.mgmtIncluded ? 0 : (store.mgmtCost != null ? store.mgmtCost * periodDays : 0);
  const totalCost = laborCost != null ? laborCost + mgmt : null;
  const hpg = (laborHrs != null && games > 0) ? (laborHrs / games) : null;
  const laborPct = (totalCost != null && revenue > 0) ? (totalCost / revenue * 100) : null;
  const goal = store.laborPctGoal;

  // Status: YES = >1pt under goal, CLOSE = within 1pt either direction, NO = >1pt over goal
  let statusClass = 'status-unknown';
  let statusWord = '—';
  let statusSub = 'Under Goal?';
  if (laborPct != null && goal != null) {
    const diff = laborPct - goal;
    if (diff < -1)      { statusClass = 'status-yes';   statusWord = 'YES';   }
    else if (diff <= 1) { statusClass = 'status-close'; statusWord = 'CLOSE'; }
    else                { statusClass = 'status-no';    statusWord = 'NO';    }
  }

  const statusClass2 = store.status.toLowerCase();

  // Labor % panel
  let pctDisplay, pctSub;
  if (laborPct != null) {
    pctDisplay = `${laborPct.toFixed(1)}%`;
    pctSub = goal != null ? `goal ${goal.toFixed(1)}%` : 'no goal set';
  } else {
    pctDisplay = null;
    pctSub = 'awaiting ADP';
  }

  // Hrs/Game panel
  let hpgDisplay, hpgSub;
  if (hpg != null) {
    hpgDisplay = hpg.toFixed(2);
    hpgSub = `${games} games`;
  } else {
    hpgDisplay = null;
    hpgSub = games > 0 ? 'awaiting ADP' : 'no games';
  }

  return `
  <div class="store-card" data-zone="${store.zone}">
    <div class="card-header">
      <div>
        <div class="store-name">${store.name.replace('GBGS ', '')}</div>
        <div class="store-zone">Zone ${store.zone}</div>
      </div>
      <div class="status-badge status-${statusClass2}">${store.status}</div>
    </div>
    <div class="card-body">
      <div class="metric">
        <div class="metric-label">Labor % Rev</div>
        ${pctDisplay
          ? `<div class="metric-value">${pctDisplay}</div>`
          : `<div class="pending">—</div>`}
        <div class="metric-sub">${pctSub}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Hrs / Game</div>
        ${hpgDisplay
          ? `<div class="metric-value">${hpgDisplay}</div>`
          : `<div class="pending">—</div>`}
        <div class="metric-sub">${hpgSub}</div>
      </div>
      <div class="metric-status ${statusClass}">
        <div class="status-sublabel">Under Goal?</div>
        <div class="status-word">${statusWord}</div>
      </div>
    </div>
  </div>`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById("zoneTabs");
  tabs.innerHTML = ["All","A","B","C"].map((z, i) =>
    `<button class="zone-tab${i===0?' active':''}" data-zone="${z}">${z === "All" ? "All Zones" : "Zone " + z}</button>`
  ).join('');
  tabs.addEventListener("click", e => {
    const btn = e.target.closest(".zone-tab");
    if (!btn) return;
    document.querySelectorAll(".zone-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    currentZone = btn.dataset.zone;
    renderGrid(currentZone);
  });
}

function renderGrid(zone = "All") {
  const filtered = zone === "All" ? STORES : STORES.filter(s => s.zone === zone);
  document.getElementById("storeGrid").innerHTML = filtered.map(buildCard).join('');
}

function updateDateNav() {
  const isDaily = currentView === "daily";
  document.getElementById("dateNav").style.display = isDaily ? "flex" : "none";
  if (!isDaily) return;
  const day = DATA.history[currentDayIndex];
  const picker = document.getElementById("datePicker");
  picker.value = day.date;
  picker.min = DATA.history[0].date;
  picker.max = DATA.history[DATA.history.length - 1].date;
  document.getElementById("datePrev").disabled = currentDayIndex === 0;
  document.getElementById("dateNext").disabled = currentDayIndex === DATA.history.length - 1;
}

function applyView() {
  let d;
  if      (currentView === "daily") d = getDailyData();
  else if (currentView === "mtd")   d = getMTDData();
  else                               d = getSnowflakeData(currentView);

  const labels = { daily: "Report Date", mtd: `MTD · ${DATA.month}`, tq: "Trailing Quarter", ytd: "Year to Date", py: "Prior Year" };
  document.getElementById("reportDate").textContent  = d.date;
  document.getElementById("reportLabel").textContent = labels[currentView];
  window.__activeStores     = d.stores;
  window.__activePeriodDays = d.days ?? 1;
  updateDateNav();
  renderGrid(currentZone);
}

// Toggle
document.querySelector(".view-toggle").addEventListener("click", e => {
  const btn = e.target.closest(".toggle-btn");
  if (!btn) return;
  document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentView = btn.dataset.view;
  applyView();
});

// Date arrows
document.getElementById("datePrev").addEventListener("click", () => {
  if (currentDayIndex > 0) { currentDayIndex--; applyView(); }
});
document.getElementById("dateNext").addEventListener("click", () => {
  if (currentDayIndex < DATA.history.length - 1) { currentDayIndex++; applyView(); }
});

// Date picker
document.getElementById("datePicker").addEventListener("change", e => {
  const val = e.target.value;
  const idx = DATA.history.findIndex(d => d.date === val);
  if (idx !== -1) { currentDayIndex = idx; applyView(); }
});

buildTabs();
applyView();
</script>
</body>
</html>
