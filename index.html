<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBGS Staffing Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1e2535;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  header .subtitle { font-size: 13px; color: #64748b; margin-top: 3px; }

  .header-right { text-align: right; }
  .report-date { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  .report-label { font-size: 11px; color: #475569; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  .no-adp-banner {
    background: #1c1a10;
    border: 1px solid #3d3308;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #d4a929;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .zone-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .zone-tab {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #1e2535;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .zone-tab:hover { border-color: #334155; color: #cbd5e1; }
  .zone-tab.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }

  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }

  .store-card {
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 10px;
    overflow: hidden;
  }

  .card-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #1e2535;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .store-name { font-size: 15px; font-weight: 700; color: #f1f5f9; }
  .store-region { font-size: 11px; color: #64748b; margin-top: 2px; }

  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-mature  { background: #052e16; color: #34d399; border: 1px solid #065f46; }
  .status-ramping { background: #1e1a05; color: #fbbf24; border: 1px solid #713f12; }
  .status-new     { background: #0f172a; color: #94a3b8; border: 1px solid #1e2535; }

  .card-body { padding: 14px 16px; }

  /* Main KPI row */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .kpi {
    background: #0f1117;
    border: 1px solid #1e2535;
    border-radius: 7px;
    padding: 9px 11px;
  }
  .kpi.kpi-bg-good { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.25); }
  .kpi.kpi-bg-warn { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.25); }
  .kpi.kpi-bg-over { background: rgba(251,113,133,0.12); border-color: rgba(251,113,133,0.28); }

  .kpi-label { font-size: 11px; font-weight: 500; color: #94a3b8; margin-bottom: 5px; letter-spacing: 0; }
  .kpi.kpi-bg-good .kpi-label { color: rgba(45,212,191,0.7); }
  .kpi.kpi-bg-warn .kpi-label { color: rgba(245,158,11,0.7); }
  .kpi.kpi-bg-over .kpi-label { color: rgba(251,113,133,0.7); }

  .kpi-value { font-size: 19px; font-weight: 700; color: #f1f5f9; line-height: 1; }
  .kpi-sub   { font-size: 10px; color: #64748b; margin-top: 3px; }
  .kpi-pending { font-size: 13px; font-weight: 600; color: #475569; }

  /* Labor cost row */
  .labor-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .labor-cell {
    background: #0f1117;
    border: 1px solid #1e2535;
    border-radius: 7px;
    padding: 8px 10px;
  }
  .labor-label { font-size: 11px; font-weight: 500; color: #94a3b8; margin-bottom: 3px; }
  .labor-value { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .labor-pending { font-size: 12px; font-weight: 500; color: #334155; }

  /* Labor % bar */
  .pct-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pct-label { font-size: 11px; color: #64748b; white-space: nowrap; }
  .pct-bar-track { flex: 1; height: 5px; background: #1e2535; border-radius: 3px; overflow: hidden; }
  .pct-bar-fill  { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .pct-good  { background: #2dd4bf; }
  .pct-warn  { background: #f59e0b; }
  .pct-over  { background: #fb7185; }
  .pct-value { font-size: 12px; font-weight: 700; white-space: nowrap; min-width: 36px; text-align: right; }
  .pct-goal  { font-size: 10px; color: #475569; white-space: nowrap; }
  .pct-none  { font-size: 11px; color: #334155; font-style: italic; }
</style>
</head>
<body>

<header>
  <div>
    <h1>GBGS Staffing Dashboard</h1>
    <div class="subtitle">Daily Labor Costs · Games Run · Hours per Game</div>
  </div>
  <div class="header-right">
    <div class="report-date" id="reportDate">—</div>
    <div class="report-label">Report Date</div>
  </div>
</header>

<div class="no-adp-banner" id="adpBanner" style="display:none">
  ⚠ ADP labor data not yet loaded for this date. Showing game counts and revenue only.
</div>

<div class="zone-tabs" id="zoneTabs"></div>
<div class="store-grid" id="storeGrid"></div>

<script>
// ─── STORE DEFINITIONS ───────────────────────────────────────────────────────
// Maps ADP code → store info including DW name for reference
const STORES = [

  { adp: "ZZV", name: "GBGS Pigeon Forge",        zone: "C", status: "New",     mgmtCost: 123.29, laborPctGoal: 25.00 },

  { adp: "HYM", name: "GBGS The Colony",          zone: "A", status: "Mature",  mgmtCost: 123.29, laborPctGoal: 18.60 },

  { adp: "SKP", name: "GBGS New Jersey",          zone: "A", status: "New",     mgmtCost: 123.29, laborPctGoal: 18.00 },

  { adp: "E3G", name: "GBGS Orlando",             zone: "A", status: "New",     mgmtCost: 123.29, laborPctGoal: 35.00 },
  { adp: "E3Q", name: "GBGS Atlanta",             zone: "A", status: "New",     mgmtCost: 123.29, laborPctGoal: 50.00 },
  // Zone B
  { adp: "AY4", name: "GBGS MOA",                 zone: "B", status: "Ramping", mgmtCost: 123.29, laborPctGoal: 29.87 },
  { adp: "ZTA", name: "GBGS SF Wharf",            zone: "B", status: "Ramping", mgmtCost: 123.29, laborPctGoal: 39.39 },
  { adp: "ZTM", name: "GBGS Oak Brook",           zone: "B", status: "Ramping", mgmtCost: 123.29, laborPctGoal: 20.11 },
  { adp: "ZU8", name: "GBGS Las Vegas",           zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 22.98 },
  { adp: "ASE", name: "GBGS Honolulu",            zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 31.14 },
  { adp: "ZUE", name: "GBGS San Jose",            zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 23.80 },
  { adp: "QTV", name: "GBGS Las Vegas Area 15",   zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 21.91 },
  { adp: "RX8", name: "GBGS Murray",              zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 35.21 },
  { adp: "J2M", name: "GBGS Schaumburg",          zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 50.00 },
  { adp: "LYC", name: "GBGS Seattle Southcenter", zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 33.67 },
  { adp: "MW2", name: "GBGS Seattle Downtown",    zone: "B", status: "New",     mgmtCost: 123.29, laborPctGoal: 27.81 },
];

// ─── DATA ────────────────────────────────────────────────────────────────────
// Updated by Claude when you upload the daily ADP report.
// reportDate: the date this data covers (YYYY-MM-DD)
// adpLoaded: true once ADP labor data has been parsed and merged
// stores: keyed by ADP code
const DATA = {
  reportDate: "2026-06-02",
  adpLoaded: true,
  stores: {
    "LUE": { games: 6,  revenue: 640.84,   laborHours: 47.08, laborCost: 638.43  },
    "ZZV": { games: 9,  revenue: 1799.46,  laborHours: 23.44, laborCost: 365.58  },
    "ZU9": { games: 5,  revenue: 1924.23,  laborHours: 26.90, laborCost: 428.47  },
    "HYM": { games: 8,  revenue: 3184.92,  laborHours: 42.62, laborCost: 687.63  },
    "ZTP": { games: 6,  revenue: 1417.65,  laborHours: 59.17, laborCost: 820.52  },
    "VPF": { games: 8,  revenue: 3788.03,  laborHours: 37.03, laborCost: 687.97  },
    "SKP": { games: 10, revenue: 1087.65,  laborHours: 53.18, laborCost: 965.81  },
    "DW9": { games: 12, revenue: 4299.59,  laborHours: 70.56, laborCost: 1260.12 },
    "00H": { games: 6,  revenue: 1527.61,  laborHours: 35.48, laborCost: 460.85  },
    "E3G": { games: 3,  revenue: 839.79,   laborHours: 43.55, laborCost: 561.48  },
    "E3Q": { games: 7,  revenue: 2217.06,  laborHours: 49.09, laborCost: 810.48  },
    "AY4": { games: 3,  revenue: 545.87,   laborHours: 62.86, laborCost: 834.51  },
    "ZTA": { games: 2,  revenue: 781.83,   laborHours: 21.60, laborCost: 425.09  },
    "ZTM": { games: 6,  revenue: 2758.62,  laborHours: 98.77, laborCost: 1583.54 },
    "ZU8": { games: 5,  revenue: 1066.15,  laborHours: 39.98, laborCost: 469.27  },
    "ASE": { games: 6,  revenue: 2225.92,  laborHours: 19.83, laborCost: 347.09  },
    "ZUE": { games: 5,  revenue: 1983.91,  laborHours: 31.46, laborCost: 602.33  },
    "QTV": { games: 9,  revenue: 1349.88,  laborHours: 38.19, laborCost: 555.79  },
    "RX8": { games: 2,  revenue: 565.35,   laborHours: 20.33, laborCost: 162.68  },
    "J2M": { games: 3,  revenue: 1135.42,  laborHours: 52.84, laborCost: 799.15  },
    "LYC": { games: 5,  revenue: 1736.65,  laborHours: 29.65, laborCost: 676.22  },
    "MW2": { games: 6,  revenue: 1601.65,  laborHours: 25.18, laborCost: 563.07  },
  }
};

// ─── RENDER ──────────────────────────────────────────────────────────────────
function fmt$(n) {
  if (n == null) return null;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtHrs(n) {
  if (n == null) return null;
  return n.toFixed(2) + ' hrs';
}

function pctClass(pct, goal) {
  if (pct == null || goal == null) return '';
  const ratio = pct / goal;
  if (ratio <= 1.05) return 'pct-good';
  if (ratio <= 1.20) return 'pct-warn';
  return 'pct-over';
}

function kpiBgClass(pct, goal) {
  if (pct == null || goal == null) return '';
  const ratio = pct / goal;
  if (ratio <= 1.05) return 'kpi-bg-good';
  if (ratio <= 1.20) return 'kpi-bg-warn';
  return 'kpi-bg-over';
}

function buildCard(store) {
  const d = DATA.stores[store.adp] || {};
  const games     = d.games ?? 0;
  const revenue   = d.revenue ?? 0;
  const laborHrs  = d.laborHours;
  const laborCost = d.laborCost;
  const mgmt      = store.mgmtCost;
  const totalCost = (laborCost != null) ? laborCost + mgmt : null;
  const hpg       = (laborHrs != null && games > 0) ? (laborHrs / games).toFixed(2) : null;
  const laborPct  = (totalCost != null && revenue > 0) ? (totalCost / revenue * 100) : null;
  const goal      = store.laborPctGoal;
  const goalCost  = (goal != null && revenue > 0) ? (goal / 100 * revenue) : null;
  const dollarVar = (totalCost != null && goalCost != null) ? (totalCost - goalCost) : null;

  // status badge
  const statusClass = `status-${store.status.toLowerCase()}`;

  // KPI: Games, Revenue, Hours/Game
  const kpiGames = `<div class="kpi">
    <div class="kpi-label">Games Run</div>
    <div class="kpi-value">${games}</div>
    <div class="kpi-sub">${fmt$(revenue) ?? '—'} rev</div>
  </div>`;

  const kpiHPG = laborHrs != null
    ? `<div class="kpi">
        <div class="kpi-label">Hrs / Game</div>
        <div class="kpi-value">${hpg ?? '—'}</div>
        <div class="kpi-sub">${fmtHrs(laborHrs)} total</div>
       </div>`
    : `<div class="kpi">
        <div class="kpi-label">Hrs / Game</div>
        <div class="kpi-pending">—</div>
        <div class="kpi-sub">awaiting ADP</div>
       </div>`;

  const kpiPct = laborPct != null
    ? `<div class="kpi ${kpiBgClass(laborPct, goal)}">
        <div class="kpi-label">Labor % of Rev</div>
        <div class="kpi-value">${laborPct.toFixed(1)}%</div>
        <div class="kpi-sub">goal ${goal != null ? goal.toFixed(1)+'%' : '—'}</div>
       </div>`
    : `<div class="kpi">
        <div class="kpi-label">Labor % of Rev</div>
        <div class="kpi-pending">—</div>
        <div class="kpi-sub">awaiting ADP</div>
       </div>`;

  // Labor detail row
  const laborRow = `
    <div class="labor-row">
      <div class="labor-cell">
        <div class="labor-label">Hourly Cost</div>
        ${laborCost != null
          ? `<div class="labor-value">${fmt$(laborCost)}</div>`
          : `<div class="labor-pending">—</div>`}
      </div>
      <div class="labor-cell">
        <div class="labor-label">Mgmt Cost</div>
        <div class="labor-value">${fmt$(mgmt)}</div>
      </div>
      <div class="labor-cell">
        <div class="labor-label">Total Labor</div>
        ${totalCost != null
          ? `<div class="labor-value">${fmt$(totalCost)}</div>`
          : `<div class="labor-pending">—</div>`}
      </div>
      <div class="labor-cell">
        <div class="labor-label">Revenue</div>
        <div class="labor-value">${fmt$(revenue) ?? '—'}</div>
      </div>
    </div>`;

  // Labor % bar + dollar variance
  let pctBar;
  if (laborPct != null && goal != null) {
    const cls = pctClass(laborPct, goal);
    const maxPct = Math.max(laborPct, goal) * 1.2;
    const wActual = laborPct / maxPct * 100;
    const wGoal   = goal / maxPct * 100;
    const varAbs  = Math.abs(dollarVar).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const varLabel = dollarVar > 0
      ? `<span style="background:rgba(251,113,133,0.12);border:1px solid rgba(251,113,133,0.28);color:#fda4af;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600">$${varAbs} over</span>`
      : dollarVar < 0
        ? `<span style="background:rgba(45,212,191,0.10);border:1px solid rgba(45,212,191,0.25);color:#5eead4;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600">$${varAbs} under</span>`
        : `<span style="background:rgba(45,212,191,0.10);border:1px solid rgba(45,212,191,0.25);color:#5eead4;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600">On target</span>`;
    const bgStyle = cls === 'pct-good'
      ? 'background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.2)'
      : cls === 'pct-warn'
        ? 'background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2)'
        : 'background:rgba(251,113,133,0.10);border:1px solid rgba(251,113,133,0.24)';
    const textColor = cls === 'pct-good' ? '#5eead4' : cls === 'pct-warn' ? '#fcd34d' : '#fda4af';
    const barColor  = cls === 'pct-good' ? 'rgba(45,212,191,0.5)' : cls === 'pct-warn' ? 'rgba(245,158,11,0.5)' : 'rgba(251,113,133,0.5)';

    pctBar = `<div style="${bgStyle};border-radius:8px;padding:10px 12px">
      <div style="font-size:11px;font-weight:500;color:${textColor};margin-bottom:8px">Labor % of Revenue</div>
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px">
          <span>0%</span><span>goal ${goal.toFixed(1)}%</span><span>${maxPct.toFixed(0)}%</span>
        </div>
        <div class="pct-bar-track" style="height:6px;position:relative;background:rgba(255,255,255,0.08)">
          <div style="height:100%;border-radius:3px;width:${wActual}%;background:${barColor}"></div>
          <div style="position:absolute;top:-2px;bottom:-2px;left:${wGoal}%;width:2px;background:rgba(255,255,255,0.3);border-radius:1px"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:20px;font-weight:700;color:${textColor}">${laborPct.toFixed(1)}%</span>
          <span style="font-size:11px;color:rgba(255,255,255,0.35)">vs ${goal.toFixed(1)}% goal</span>
        </div>
        ${varLabel}
      </div>
    </div>`;
  } else if (laborPct != null) {
    const cls = 'pct-good';
    pctBar = `<div class="pct-row">
      <div class="pct-label">Labor % Rev</div>
      <div class="pct-bar-track"><div class="pct-bar-fill ${cls}" style="width:${Math.min(laborPct,60)/60*100}%"></div></div>
      <div class="pct-value ${cls}">${laborPct.toFixed(1)}%</div>
      <div class="pct-goal">no goal set</div>
    </div>`;
  } else {
    pctBar = `<div class="pct-row"><div class="pct-none">Upload ADP report to see labor % of revenue</div></div>`;
  }

  return `
  <div class="store-card" data-zone="${store.zone}">
    <div class="card-header">
      <div>
        <div class="store-name">${store.name}</div>
        <div class="store-region">Zone ${store.zone} · ADP: ${store.adp}</div>
      </div>
      <div class="status-badge ${statusClass}">${store.status}</div>
    </div>
    <div class="card-body">
      <div class="kpi-grid">${kpiGames}${kpiHPG}${kpiPct}</div>
      ${laborRow}
      ${pctBar}
    </div>
  </div>`;
}

function buildTabs() {
  const tabs = document.getElementById("zoneTabs");
  tabs.innerHTML = ["All","A","B","C"].map((z, i) =>
    `<button class="zone-tab${i===0?' active':''}" data-zone="${z}">${z === "All" ? "All Zones" : "Zone " + z}</button>`
  ).join('');
  tabs.addEventListener("click", e => {
    const btn = e.target.closest(".zone-tab");
    if (!btn) return;
    document.querySelectorAll(".zone-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderGrid(btn.dataset.zone);
  });
}

function renderGrid(zone = "All") {
  const filtered = zone === "All" ? STORES : STORES.filter(s => s.zone === zone);
  document.getElementById("storeGrid").innerHTML = filtered.map(buildCard).join('');
}

// Banner & date
document.getElementById("reportDate").textContent = DATA.reportDate;
if (!DATA.adpLoaded) document.getElementById("adpBanner").style.display = "flex";

buildTabs();
renderGrid("All");
</script>
</body>
</html>
