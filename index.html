<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBGS Staffing Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1e2535;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  header .subtitle { font-size: 13px; color: #64748b; margin-top: 3px; }

  .header-right { text-align: right; }
  .report-date { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  .report-label { font-size: 11px; color: #475569; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  .no-adp-banner {
    background: #1c1a10;
    border: 1px solid #3d3308;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #d4a929;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .zone-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .zone-tab {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #1e2535;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .zone-tab:hover { border-color: #334155; color: #cbd5e1; }
  .zone-tab.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }

  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }

  .store-card {
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 10px;
    overflow: hidden;
  }

  .card-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #1e2535;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .store-name { font-size: 15px; font-weight: 700; color: #f1f5f9; }
  .store-region { font-size: 11px; color: #64748b; margin-top: 2px; }

  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-mature  { background: #052e16; color: #34d399; border: 1px solid #065f46; }
  .status-ramping { background: #1e1a05; color: #fbbf24; border: 1px solid #713f12; }
  .status-new     { background: #0f172a; color: #94a3b8; border: 1px solid #1e2535; }

  .card-body { padding: 14px 16px; }

  /* Main KPI row */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .kpi {
    background: #0f1117;
    border: 1px solid #1e2535;
    border-radius: 7px;
    padding: 9px 11px;
  }
  .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin-bottom: 4px; }
  .kpi-value { font-size: 19px; font-weight: 700; color: #f1f5f9; line-height: 1; }
  .kpi-sub   { font-size: 10px; color: #64748b; margin-top: 3px; }
  .kpi-pending { font-size: 13px; font-weight: 600; color: #475569; }

  /* Labor cost row */
  .labor-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .labor-cell {
    background: #0f1117;
    border: 1px solid #1e2535;
    border-radius: 7px;
    padding: 8px 10px;
  }
  .labor-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin-bottom: 3px; }
  .labor-value { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .labor-pending { font-size: 12px; font-weight: 500; color: #334155; }

  /* Labor % bar */
  .pct-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pct-label { font-size: 11px; color: #64748b; white-space: nowrap; }
  .pct-bar-track { flex: 1; height: 5px; background: #1e2535; border-radius: 3px; overflow: hidden; }
  .pct-bar-fill  { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .pct-good  { background: #34d399; }
  .pct-warn  { background: #fbbf24; }
  .pct-over  { background: #f87171; }
  .pct-value { font-size: 12px; font-weight: 700; white-space: nowrap; min-width: 36px; text-align: right; }
  .pct-goal  { font-size: 10px; color: #475569; white-space: nowrap; }
  .pct-none  { font-size: 11px; color: #334155; font-style: italic; }
</style>
</head>
<body>

<header>
  <div>
    <h1>GBGS Staffing Dashboard</h1>
    <div class="subtitle">Daily Labor Costs · Games Run · Hours per Game</div>
  </div>
  <div class="header-right">
    <div class="report-date" id="reportDate">—</div>
    <div class="report-label">Report Date</div>
  </div>
</header>

<div class="no-adp-banner" id="adpBanner" style="display:none">
  ⚠ ADP labor data not yet loaded for this date. Showing game counts and revenue only.
</div>

<div class="zone-tabs" id="zoneTabs"></div>
<div class="store-grid" id="storeGrid"></div>

<script>
// ─── STORE DEFINITIONS ───────────────────────────────────────────────────────
// Maps ADP code → store info including DW name for reference
const STORES = [
  { adp: "LUE", name: "GBGS Opry",               region: "East", status: "Mature",  mgmtCost: 123.29 },
  { adp: "HYM", name: "GBGS The Colony",          region: "East", status: "Mature",  mgmtCost: 123.29 },
  { adp: "AY4", name: "GBGS MOA",                 region: "West", status: "Ramping", mgmtCost: 123.29 },
  { adp: "ZTA", name: "GBGS SF Wharf",            region: "West", status: "Ramping", mgmtCost: 123.29 },
  { adp: "ZTP", name: "GBGS Houston",             region: "East", status: "Ramping", mgmtCost: 123.29 },
  { adp: "ZTM", name: "GBGS Oak Brook",           region: "West", status: "Ramping", mgmtCost: 123.29 },
  { adp: "ZZV", name: "GBGS Pigeon Forge",        region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "SKP", name: "GBGS New Jersey",          region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "ZU8", name: "GBGS Las Vegas",           region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "ASE", name: "GBGS Honolulu",            region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "VPF", name: "GBGS Georgetown",          region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "ZU9", name: "GBGS St. Louis",           region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "ZUE", name: "GBGS San Jose",            region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "MW2", name: "GBGS Seattle Downtown",    region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "LYC", name: "GBGS Seattle Southcenter", region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "DW9", name: "GBGS Times Square",        region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "QTV", name: "GBGS Las Vegas Area 15",   region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "RX8", name: "GBGS Murray",              region: "West", status: "New",     mgmtCost: 123.29 },
  { adp: "00H", name: "GBGS Birmingham",          region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "E3G", name: "GBGS Orlando",             region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "E3Q", name: "GBGS Atlanta",             region: "East", status: "New",     mgmtCost: 123.29 },
  { adp: "J2M", name: "GBGS Schaumburg",          region: "East", status: "New",     mgmtCost: 123.29 },
];

// ─── DATA ────────────────────────────────────────────────────────────────────
// Updated by Claude when you upload the daily ADP report.
// reportDate: the date this data covers (YYYY-MM-DD)
// adpLoaded: true once ADP labor data has been parsed and merged
// stores: keyed by ADP code
const DATA = {
  reportDate: "2026-06-01",
  adpLoaded: false,
  stores: {
    "LUE": { games: 7,  revenue: 1759.56, laborHours: null, laborCost: null },
    "HYM": { games: 8,  revenue: 1674.13, laborHours: null, laborCost: null },
    "AY4": { games: 3,  revenue: 142.77,  laborHours: null, laborCost: null },
    "ZTA": { games: 4,  revenue: 1499.28, laborHours: null, laborCost: null },
    "ZTP": { games: 6,  revenue: 2087.46, laborHours: null, laborCost: null },
    "ZTM": { games: 3,  revenue: 1217.39, laborHours: null, laborCost: null },
    "ZZV": { games: 7,  revenue: 1159.61, laborHours: null, laborCost: null },
    "SKP": { games: 10, revenue: 1306.12, laborHours: null, laborCost: null },
    "ZU8": { games: 4,  revenue: 550.27,  laborHours: null, laborCost: null },
    "ASE": { games: 5,  revenue: 1083.07, laborHours: null, laborCost: null },
    "VPF": { games: 5,  revenue: 2150.68, laborHours: null, laborCost: null },
    "ZU9": { games: 5,  revenue: 1097.93, laborHours: null, laborCost: null },
    "ZUE": { games: 6,  revenue: 2396.49, laborHours: null, laborCost: null },
    "MW2": { games: 7,  revenue: 2591.44, laborHours: null, laborCost: null },
    "LYC": { games: 0,  revenue: 0,       laborHours: null, laborCost: null },
    "DW9": { games: 10, revenue: 3310.77, laborHours: null, laborCost: null },
    "QTV": { games: 7,  revenue: 343.92,  laborHours: null, laborCost: null },
    "RX8": { games: 2,  revenue: 686.23,  laborHours: null, laborCost: null },
    "00H": { games: 5,  revenue: 1687.58, laborHours: null, laborCost: null },
    "E3G": { games: 8,  revenue: 1675.60, laborHours: null, laborCost: null },
    "E3Q": { games: 5,  revenue: 1555.57, laborHours: null, laborCost: null },
    "J2M": { games: 1,  revenue: 139.37,  laborHours: null, laborCost: null },
  }
};

// ─── RENDER ──────────────────────────────────────────────────────────────────
function fmt$(n) {
  if (n == null) return null;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtHrs(n) {
  if (n == null) return null;
  return n.toFixed(2) + ' hrs';
}

function pctClass(pct, goal) {
  if (pct == null) return '';
  const ratio = pct / goal;
  if (ratio <= 1.05) return 'pct-good';
  if (ratio <= 1.20) return 'pct-warn';
  return 'pct-over';
}

function buildCard(store) {
  const d = DATA.stores[store.adp] || {};
  const games     = d.games ?? 0;
  const revenue   = d.revenue ?? 0;
  const laborHrs  = d.laborHours;
  const laborCost = d.laborCost;
  const mgmt      = store.mgmtCost;
  const totalCost = (laborCost != null) ? laborCost + mgmt : null;
  const hpg       = (laborHrs != null && games > 0) ? (laborHrs / games).toFixed(2) : null;
  const laborPct  = (totalCost != null && revenue > 0) ? (totalCost / revenue * 100) : null;

  // status badge
  const statusClass = `status-${store.status.toLowerCase()}`;

  // KPI: Games, Revenue, Hours/Game
  const kpiGames = `<div class="kpi">
    <div class="kpi-label">Games Run</div>
    <div class="kpi-value">${games}</div>
    <div class="kpi-sub">${fmt$(revenue) ?? '—'} rev</div>
  </div>`;

  const kpiHPG = laborHrs != null
    ? `<div class="kpi">
        <div class="kpi-label">Hrs / Game</div>
        <div class="kpi-value">${hpg ?? '—'}</div>
        <div class="kpi-sub">${fmtHrs(laborHrs)} total</div>
       </div>`
    : `<div class="kpi">
        <div class="kpi-label">Hrs / Game</div>
        <div class="kpi-pending">—</div>
        <div class="kpi-sub">awaiting ADP</div>
       </div>`;

  const kpiPct = laborPct != null
    ? `<div class="kpi">
        <div class="kpi-label">Labor % Rev</div>
        <div class="kpi-value ${pctClass(laborPct, 20)}">${laborPct.toFixed(1)}%</div>
        <div class="kpi-sub">goal ≤ 20%</div>
       </div>`
    : `<div class="kpi">
        <div class="kpi-label">Labor % Rev</div>
        <div class="kpi-pending">—</div>
        <div class="kpi-sub">awaiting ADP</div>
       </div>`;

  // Labor detail row
  const laborRow = `
    <div class="labor-row">
      <div class="labor-cell">
        <div class="labor-label">Hourly Cost</div>
        ${laborCost != null
          ? `<div class="labor-value">${fmt$(laborCost)}</div>`
          : `<div class="labor-pending">—</div>`}
      </div>
      <div class="labor-cell">
        <div class="labor-label">Mgmt Cost</div>
        <div class="labor-value">${fmt$(mgmt)}</div>
      </div>
      <div class="labor-cell">
        <div class="labor-label">Total Labor</div>
        ${totalCost != null
          ? `<div class="labor-value">${fmt$(totalCost)}</div>`
          : `<div class="labor-pending">—</div>`}
      </div>
      <div class="labor-cell">
        <div class="labor-label">Revenue</div>
        <div class="labor-value">${fmt$(revenue) ?? '—'}</div>
      </div>
    </div>`;

  // Labor % bar
  let pctBar;
  if (laborPct != null) {
    const cls = pctClass(laborPct, 20);
    const w = Math.min(laborPct, 60) / 60 * 100; // scale bar to 60% max
    pctBar = `<div class="pct-row">
      <div class="pct-label">Labor %</div>
      <div class="pct-bar-track"><div class="pct-bar-fill ${cls}" style="width:${w}%"></div></div>
      <div class="pct-value ${cls}">${laborPct.toFixed(1)}%</div>
      <div class="pct-goal">/ goal 20%</div>
    </div>`;
  } else {
    pctBar = `<div class="pct-row"><div class="pct-none">Upload ADP report to see labor % of revenue</div></div>`;
  }

  return `
  <div class="store-card" data-region="${store.region}">
    <div class="card-header">
      <div>
        <div class="store-name">${store.name}</div>
        <div class="store-region">${store.region} · ADP: ${store.adp}</div>
      </div>
      <div class="status-badge ${statusClass}">${store.status}</div>
    </div>
    <div class="card-body">
      <div class="kpi-grid">${kpiGames}${kpiHPG}${kpiPct}</div>
      ${laborRow}
      ${pctBar}
    </div>
  </div>`;
}

function buildTabs() {
  const regions = ["All", ...new Set(STORES.map(s => s.region))].sort((a, b) => a === "All" ? -1 : 0);
  const tabs = document.getElementById("zoneTabs");
  tabs.innerHTML = regions.map((r, i) =>
    `<button class="zone-tab${i===0?' active':''}" data-region="${r}">${r}</button>`
  ).join('');
  tabs.addEventListener("click", e => {
    const btn = e.target.closest(".zone-tab");
    if (!btn) return;
    document.querySelectorAll(".zone-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderGrid(btn.dataset.region);
  });
}

function renderGrid(region = "All") {
  const filtered = region === "All" ? STORES : STORES.filter(s => s.region === region);
  document.getElementById("storeGrid").innerHTML = filtered.map(buildCard).join('');
}

// Banner & date
document.getElementById("reportDate").textContent = DATA.reportDate;
if (!DATA.adpLoaded) document.getElementById("adpBanner").style.display = "flex";

buildTabs();
renderGrid();
</script>
</body>
</html>
